<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生クエスト</title>
<style>
:root{
  --bg-color:#fffae6;      /* 温かみのあるポップなイエローベージュ */
  --card-bg:#ffffff;
  --text-main:#1a1a1a;
  --text-sub:#4a4a4a;
  --border-main:#1a1a1a;   /* ポップさを際立たせる太めの黒線 */

  --color-pink:#ff6b8b;
  --color-blue:#4dabf7;
  --color-orange:#ff922b;
  --color-yellow:#fcc419;
  --color-green:#40c057;
  --color-purple:#b197fc;

  /* 資本の色 */
  /* 資本の色（1枚目のチケットの黄・紫、2枚目の看板の水色から） */
  --human:#4dabf7; --social:#ff922b; --money:#f4e02a; --asset:#74c0c8; --time:#9775fa;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  background-color:var(--bg-color);
  color:var(--text-main);
  margin:0; padding:0; line-height:1.6; font-weight:700;
}
.container{max-width:900px;margin:0 auto;padding:40px 20px 60px}

/* ── カード共通 ── */
.card{
  background:var(--card-bg); border:3px solid var(--border-main); border-radius:24px;
  padding:26px; box-shadow:8px 8px 0 var(--border-main); margin-bottom:34px;
}
.card > h2{
  font-size:1.3rem; font-weight:900; margin:0 0 18px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  border-bottom:3px dashed var(--border-main); padding-bottom:12px;
}
.card > h2 span{font-size:.9rem;font-weight:700;color:var(--text-sub)}

/* ── ヘッダー ── */
header{text-align:center}
header h1{font-size:2.4rem;margin:0;font-weight:900;letter-spacing:.02em}
.lead{
  font-size:1.05rem;font-weight:700;color:var(--text-main);margin:10px 0 0;display:inline-block;
  background:var(--color-yellow);padding:2px 14px;border-radius:8px;border:2px solid var(--border-main);
}
.site-desc{font-size:.95rem;color:var(--text-sub);margin:15px auto 0;max-width:600px;font-weight:700}
.today{
  display:inline-block;margin-top:14px;font-size:.85rem;font-weight:800;
  background:var(--card-bg);border:2px solid var(--border-main);border-radius:30px;padding:3px 16px;
  box-shadow:2px 2px 0 var(--border-main);
}

/* ── ステータス ── */
.status-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.lv-badge{
  background:var(--color-yellow);border:3px solid var(--border-main);border-radius:16px;
  padding:8px 18px;box-shadow:4px 4px 0 var(--border-main);display:flex;align-items:baseline;gap:8px;
}
.lv-badge small{font-size:.8rem;font-weight:800}
.lv-badge b{font-size:2rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.lv-title{font-weight:900;font-size:1.1rem}
.pill{
  border:2px solid var(--border-main);border-radius:30px;padding:4px 14px;font-weight:800;font-size:.9rem;
  box-shadow:2px 2px 0 var(--border-main);background:var(--card-bg);white-space:nowrap;
}
.pill b{font-variant-numeric:tabular-nums;font-weight:900}
.pill.gold{background:var(--color-orange)}
.pill.done{background:var(--color-blue)}
.pill.waste{background:#ffc9c9}
.bar{
  height:16px;background:#f1f3f5;border:3px solid var(--border-main);border-radius:30px;overflow:hidden;
}
.bar i{display:block;height:100%;background:var(--color-green);transition:width .4s ease}
.bar-note{display:flex;justify-content:space-between;font-size:.8rem;font-weight:800;margin-top:6px;
  font-variant-numeric:tabular-nums;color:var(--text-sub)}

.caps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
@media(max-width:640px){.caps{grid-template-columns:repeat(2,1fr)}}
.cap{border:2px solid var(--border-main);border-radius:14px;padding:10px 12px;background:#fafafa;
  text-align:left;font-family:inherit;cursor:pointer;box-shadow:2px 2px 0 var(--border-main);width:100%}
.cap:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--border-main);background:#fff}
.cap-more{display:block;font-size:.68rem;font-weight:800;color:var(--text-sub);margin-top:6px}
.cap-name{font-size:.85rem;font-weight:800;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cap-name em{font-style:normal;font-size:.75rem;color:var(--text-sub)}
.cap-name .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border-main);flex:none}
.cap-val{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.cap small{display:block;font-size:.7rem;color:var(--text-sub);font-weight:700;line-height:1.35}

/* ── タブ ── */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.tab{
  background:var(--card-bg);border:3px solid var(--border-main);border-radius:12px;
  padding:8px 18px;font-weight:800;font-size:.95rem;cursor:pointer;color:var(--text-main);
  box-shadow:3px 3px 0 var(--border-main);transition:transform .1s ease, box-shadow .1s ease;
}
.tab:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--border-main)}
.tab[aria-selected="true"]{background:var(--color-yellow)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid var(--color-blue);outline-offset:2px}

/* ── 1日のスケジュール ── */
.sched{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:start;margin-bottom:20px}
@media(max-width:640px){.sched{grid-template-columns:1fr}.sched-pal{order:-1}}
.sched-grid{border:2px solid var(--border-main);border-radius:14px;overflow:hidden;touch-action:none;
  box-shadow:3px 3px 0 var(--border-main)}
.slot{display:grid;grid-template-columns:56px 1fr;align-items:center;width:100%;
  border:none;border-top:1px solid #e9ecef;background:#fff;padding:0;font-family:inherit;cursor:pointer}
.slot:first-child{border-top:none}
.slot.hour{border-top:2px solid var(--border-main)}
.slot-time{font-size:.72rem;font-weight:800;color:var(--text-sub);text-align:right;padding-right:8px;
  font-variant-numeric:tabular-nums}
.slot-fill{height:22px;border-left:2px solid var(--border-main);display:flex;align-items:center;
  padding-left:8px;font-size:.72rem;font-weight:800}
.slot:hover .slot-fill{filter:brightness(.96)}
.sched-pal{border:2px solid var(--border-main);border-radius:14px;padding:12px;background:#fafafa;
  box-shadow:3px 3px 0 var(--border-main)}
.sched-pal h3{font-size:.85rem;font-weight:900;margin:0 0 4px}
.sched-pal p{font-size:.72rem;color:var(--text-sub);margin:0 0 10px}
.pal{display:flex;flex-direction:column;gap:7px}
.pal button{border:2px solid var(--border-main);border-radius:10px;padding:8px 12px;font-weight:800;
  font-size:.85rem;cursor:pointer;font-family:inherit;text-align:left;background:#fff;color:var(--text-main)}
.pal button[aria-pressed="true"]{box-shadow:3px 3px 0 var(--border-main);transform:translate(-1px,-1px)}
.sched-sum{border-top:2px dashed var(--border-main);margin-top:12px;padding-top:10px;font-size:.75rem;font-weight:800}
.sched-sum div{display:flex;justify-content:space-between;padding:2px 0}
.sched-sum b{font-variant-numeric:tabular-nums}

/* ── 項目 ── */
.items{display:flex;flex-direction:column;gap:14px}
.item{
  display:flex;align-items:center;gap:14px;background:var(--card-bg);
  border:2px solid var(--border-main);border-left-width:10px;border-radius:14px;padding:12px 14px;
  box-shadow:3px 3px 0 var(--border-main);
}
.item.done{background:#f1f3f5;opacity:.75}
.item.done .t{text-decoration:line-through;color:var(--text-sub)}
.item .name{flex:1;min-width:0;font-size:1rem;font-weight:800}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag{border:2px solid var(--border-main);border-radius:30px;padding:0 10px;font-size:.72rem;font-weight:800;
  background:#f8f9fa;font-variant-numeric:tabular-nums}
.res{border:2px solid var(--border-main);border-radius:30px;padding:1px 10px;font-size:.72rem;font-weight:800;
  color:var(--text-main);background:var(--card-bg);display:inline-block}
.streak{font-size:.72rem;font-weight:800;color:#e8590c}
.check{
  width:38px;height:38px;flex:none;border-radius:12px;border:3px solid var(--border-main);
  background:var(--color-green);color:#fff;font-size:1.1rem;font-weight:900;cursor:pointer;
  box-shadow:2px 2px 0 var(--border-main);line-height:1;
}
.check:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--border-main)}
.item.done .check{background:#ced4da;color:var(--text-sub)}
.del{background:none;border:none;color:var(--text-sub);cursor:pointer;font-size:1.1rem;font-weight:900;padding:2px 4px}
.del:hover{color:#e03131}
.empty{
  border:3px dashed var(--border-main);border-radius:14px;padding:18px;text-align:center;
  font-weight:700;color:var(--text-sub);background:#fafafa;
}

/* ── ボス ── */
.boss{background:#fff;border:3px solid var(--border-main);border-radius:16px;padding:16px;
  box-shadow:4px 4px 0 var(--border-main)}
.boss + .boss{margin-top:14px}
.boss-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.boss-name{font-size:1.25rem;font-weight:900}
.boss-hp{height:18px;background:#f1f3f5;border:3px solid var(--border-main);border-radius:30px;
  overflow:hidden;margin:10px 0 8px}
.boss-hp i{display:block;height:100%;background:var(--color-pink);transition:width .4s ease}
.boss-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.boss-num{font-size:.78rem;font-weight:800;color:var(--text-sub);font-variant-numeric:tabular-nums}
.boss.slain{background:#f1f3f5;opacity:.85}
.boss.slain .boss-name::after{content:" 討伐済";font-size:.75rem;color:var(--color-green)}

/* ── フォーム ── */
.form{margin-top:20px;border-top:3px dashed var(--border-main);padding-top:18px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.form input[type=text]{flex:1 1 220px;min-width:0}
.form-label{width:100%;font-size:.8rem;font-weight:800;color:var(--text-sub);margin-bottom:-2px}
input,select{
  background:#fff;border:2px solid var(--border-main);color:var(--text-main);border-radius:10px;
  padding:10px 12px;font-size:.9rem;font-family:inherit;font-weight:700;
}
input[type=number]{width:90px;font-variant-numeric:tabular-nums}
.btn{
  background:var(--color-blue);color:var(--text-main);border:3px solid var(--border-main);border-radius:12px;
  padding:10px 24px;font-weight:800;font-size:.95rem;cursor:pointer;
  box-shadow:4px 4px 0 var(--border-main);transition:transform .1s ease, box-shadow .1s ease;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--border-main);background:#339af0}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border-main)}
.btn:disabled{background:#e9ecef;color:#adb5bd;box-shadow:2px 2px 0 #adb5bd;border-color:#adb5bd;
  cursor:default;transform:none}
.btn.yellow{background:var(--color-yellow)}
.btn.yellow:hover{background:#ffd43b}
.btn.small{padding:6px 16px;font-size:.82rem;border-width:2px;box-shadow:2px 2px 0 var(--border-main)}
.btn.danger{background:#fff;color:#e03131}
.btn.danger:hover{background:#ffe3e3}

/* 6項目トグル */
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{
  background:#fff;border:2px solid var(--border-main);border-radius:30px;padding:6px 14px;
  font-weight:800;font-size:.82rem;cursor:pointer;color:var(--text-main);
  box-shadow:2px 2px 0 var(--border-main);
}
.flag:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--border-main)}

/* ── Notion ── */
.notice{
  background:#fff4e6;border:3px solid var(--border-main);border-radius:16px;padding:18px;
  font-weight:700;font-size:.92rem;box-shadow:4px 4px 0 var(--border-main);
}
.notice.bad{background:#fff5f5}
.pagepick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pagepick button{
  background:#fff;border:2px solid var(--border-main);border-radius:10px;padding:7px 14px;
  font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:2px 2px 0 var(--border-main);color:var(--text-main);
}
.pagepick button[aria-pressed="true"]{background:var(--color-yellow)}
.sect{
  display:inline-block;background:var(--border-main);color:#fff;font-weight:800;font-size:.85rem;
  padding:2px 12px;border-radius:6px;margin:22px 0 10px;
}
.sect:first-of-type{margin-top:4px}
.src{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:3px dashed var(--border-main);padding-bottom:14px;margin-bottom:6px;font-weight:800;
}
.src a{color:var(--text-main);text-decoration:underline;text-underline-offset:3px}
.src a:hover{color:#1c7ed6}
.busy{opacity:.5;pointer-events:none}

/* ── 攻略法 ── */
figure{margin:0 0 22px}
figure svg{width:100%;height:auto;color:var(--text-main)}
figcaption{font-size:.85rem;color:var(--text-sub);margin-top:12px;text-align:center;font-weight:700}
.route{border-top:3px dashed var(--border-main);padding-top:18px;margin-top:18px}
.route h3{font-size:1.15rem;font-weight:900;margin:0 0 10px}
.route p{font-size:.92rem;margin:0 0 12px}
.route ul{margin:0;padding-left:22px;font-size:.9rem}
.route li{margin-bottom:8px}
.axes{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.axis{
  display:flex;align-items:center;gap:12px;font-size:.92rem;background:#fafafa;
  border:2px solid var(--border-main);border-radius:12px;padding:10px 14px;
}
.axis .num{
  width:30px;height:30px;flex:none;border:2px solid var(--border-main);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;
}
.axis b{margin-left:auto;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── スキル ── */
.sk-mine{margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--border-main);border-radius:30px;
  padding:6px 8px 6px 15px;font-size:.88rem;font-weight:800;background:#fff}
.chip-x{background:none;border:none;color:#adb5bd;cursor:pointer;font-size:.8rem;font-weight:900;
  padding:0 3px;line-height:1;font-family:inherit}
.chip-x:hover{color:#e03131}
.sk-sug{margin-top:22px;border-top:3px dashed var(--border-main);padding-top:18px}
.sk-sug h3{font-size:1rem;font-weight:900;margin:0 0 4px}
.sk-sug p{font-size:.85rem;color:var(--text-sub);margin:0 0 14px}
.sug-group{margin-bottom:12px}
.sug-cat{font-size:.78rem;font-weight:800;color:var(--text-sub);margin-bottom:6px}
.sug-chips{display:flex;flex-wrap:wrap;gap:7px}
.sug{border:2px solid var(--border-main);border-radius:30px;padding:6px 15px;font-size:.85rem;font-weight:800;
  background:#fff;cursor:pointer;font-family:inherit;color:var(--text-main)}
.sug:hover{background:var(--color-yellow)}
.sug.added{background:#f1f3f5;color:#adb5bd;border-color:#dee2e6}
.sug.added:hover{background:#e9ecef}

.cap-page-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.cap-lv{border:3px solid var(--border-main);border-radius:16px;padding:6px 16px;font-weight:900;
  box-shadow:3px 3px 0 var(--border-main);display:flex;align-items:baseline;gap:6px}
.cap-lv b{font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.cap-desc{font-size:.95rem;margin:0 0 18px;font-weight:700}
.cap-sec{border-top:3px dashed var(--border-main);padding-top:16px;margin-top:18px}
.cap-sec h3{font-size:1rem;font-weight:900;margin:0 0 4px}
.cap-sec p{font-size:.85rem;color:var(--text-sub);margin:0 0 12px}

.principles{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.principle{border:2px solid var(--border-main);border-radius:12px;padding:10px 14px;background:var(--color-yellow);
  font-weight:800;font-size:.95rem;box-shadow:2px 2px 0 var(--border-main)}
.principle b{display:inline-block;background:var(--border-main);color:#fff;border-radius:6px;
  padding:0 8px;margin-right:10px;font-size:.78rem}
.rule-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.rule{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;
  border:2px solid var(--border-main);border-radius:10px;padding:7px 12px;background:#fff;
  font-weight:800;font-size:.85rem;cursor:pointer;color:var(--text-main)}
.rule:hover{background:#fffaf0}
.rule.on{background:var(--color-green)}
.rule.on .rule-n{background:#fff}
.rule-n{flex:none;width:26px;height:26px;border:2px solid var(--border-main);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-variant-numeric:tabular-nums;
  background:#fff}
.rule-col{font-size:.78rem;font-weight:800;color:var(--text-sub);border-left:4px solid var(--border-main);
  padding-left:10px;margin:0 0 16px}

/* ── 履歴（年表） ── */
.tl-setup{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:3px;background:var(--border-main)}
.tl-row{position:relative;display:flex;gap:16px;align-items:baseline;padding:9px 0;
  border-bottom:2px dashed #e9ecef}
.tl-row:last-child{border-bottom:none}
.tl-row::before{content:"";position:absolute;left:-21px;top:16px;width:11px;height:11px;border-radius:50%;
  background:var(--card-bg);border:3px solid var(--border-main)}
.tl-row.filled::before{background:var(--color-yellow)}
.tl-when{flex:none;width:170px;display:flex;align-items:baseline;gap:8px}
.tl-wa{font-size:.8rem;font-weight:800}
.tl-ad{font-size:.78rem;font-weight:700;color:var(--text-sub);font-variant-numeric:tabular-nums}
.tl-age{font-size:.78rem;font-weight:800;color:var(--text-sub);margin-left:auto}
.tl-word{flex:1;min-width:0;font-weight:800}
.tl-word input{width:100%;border-width:2px;padding:7px 10px}
.tl-read .tl-row{padding:11px 0}
@media(max-width:560px){
  .tl-row{flex-direction:column;gap:4px;align-items:stretch}
  .tl-when{width:100%}
  .tl-age{margin-left:0}
}

/* ── ごほうび・記録 ── */
.reward{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed #ced4da;flex-wrap:wrap}
.reward:last-of-type{border-bottom:none}
.reward .name{flex:1;min-width:120px;font-weight:800}
.reward .cost{font-weight:900;background:var(--color-yellow);border:2px solid var(--border-main);
  border-radius:30px;padding:1px 12px;font-size:.82rem;font-variant-numeric:tabular-nums}
.log{max-height:260px;overflow-y:auto}
.log ul{margin:0;padding:0;list-style:none}
.log li{font-size:.85rem;padding:8px 0;border-bottom:2px dashed #dee2e6;display:flex;gap:12px}
.log li:last-child{border-bottom:none}
.log time{font-size:.78rem;color:var(--text-sub);flex:none;font-family:monospace;padding-top:2px}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}

/* ── トースト ── */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:12px;z-index:40;max-width:330px}
.toast{
  background:var(--card-bg);border:3px solid var(--border-main);border-radius:16px;padding:14px 18px;
  font-size:.9rem;font-weight:800;box-shadow:5px 5px 0 var(--border-main);animation:rise .25s ease;
}
.toast.level{background:var(--color-yellow)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

footer{text-align:center;margin-top:20px;font-size:.9rem;font-weight:700;color:var(--text-sub)}
footer button{background:none;border:none;color:var(--text-sub);text-decoration:underline;
  text-underline-offset:4px;cursor:pointer;font-size:.9rem;font-weight:700;font-family:inherit}
footer button:hover{color:#e03131}
</style>
</head>
<body>
<div class="container">
  <header class="card">
    <h1>人生クエスト</h1>
    <p class="lead">Life Capital Quest</p>
    <p class="site-desc">唯一の元手である「時間」を、人的資本・社会的資本・金融資本・知的資産に変えて、最後に時間を買い戻すためのゲーム。やったことに「何が残ったか」を記録していきます。</p>
  </header>

  <section class="card" id="daily-card"></section>

  <section class="card">
    <h2>ステータス <span id="cap-total"></span></h2>
    <div class="status-top">
      <div class="lv-badge"><small>Lv.</small><b id="level">1</b></div>
      <div class="lv-title" id="title-name"></div>
      <div class="pill gold">ゴールド <b id="gold">0</b></div>
      <div class="pill done">今日の達成 <b id="today-done">0</b></div>
      <div class="pill waste">浪費 <b id="spent">0</b> 回</div>
    </div>
    <div class="bar"><i id="exp-bar" style="width:0%"></i></div>
    <div class="bar-note"><span>EXP</span><span id="exp-note">0 / 80</span></div>
    <div class="caps" id="caps"></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="quest" aria-selected="true">クエスト</button>
    <button class="tab" role="tab" data-tab="boss" aria-selected="false">ボス</button>
    <button class="tab" role="tab" data-tab="notion" aria-selected="false">Notion</button>
    <button class="tab" role="tab" data-tab="history" aria-selected="false">履歴</button>
    <button class="tab" role="tab" data-tab="map" aria-selected="false">攻略法</button>
  </div>

  <section class="card" id="panel"></section>

  <section class="card">
    <h2>ごほうび交換所 <span>ゴールドで自分にごほうびを</span></h2>
    <div id="rewards"></div>
    <div class="form">
      <input type="text" id="r-name" placeholder="ごほうび（例：映画を観る）" maxlength="40">
      <input type="number" id="r-cost" value="50" min="1" max="9999" aria-label="必要ゴールド">
      <button class="btn yellow" data-add="reward">追加</button>
    </div>
  </section>

  <section class="card">
    <h2>冒険の記録</h2>
    <div class="log"><ul id="log"></ul></div>
  </section>

  <footer>
    <p>データはブラウザに自動保存 · <button id="reset">すべて消してはじめから</button></p>
  </footer>
</div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";
const KEY = "jinsei-quest-v2", OLD_KEY = "jinsei-quest-v1";

/* ── モデル：時間 → 4つの資本 → 時間 ────────────────── */
const CAPITALS = {
  human :{name:"人的資本",  sub:"吸収",     color:"var(--human)",  note:"スキル・知識・経験"},
  social:{name:"社会的資本", sub:"つながり・発信", color:"var(--social)", note:"人脈・信頼・評判・発信"},
  money :{name:"金融資本",  sub:"仕事促進",  color:"var(--money)",  note:"お金・資産・収入源"},
  asset :{name:"知的資産",  sub:"創造",     color:"var(--asset)",  note:"作品・記事・権利"},
  time  :{name:"自由時間",  sub:"浪費",     color:"var(--time)",   note:"買い戻した将来の時間"},
};

/** 行動を評価する6項目。チェックした数だけ資本に変わる */
const RESIDUES = [
  {key:"ability",  n:1, name:"能力",   full:"能力が残る",           caps:["human"]},
  {key:"record",   n:2, name:"実績",   full:"実績が残る",           caps:["human","social"]},
  {key:"work",     n:3, name:"作品",   full:"作品・コンテンツが残る", caps:["asset"]},
  {key:"relation", n:4, name:"関係",   full:"人との関係が残る",      caps:["social"]},
  {key:"money",    n:5, name:"お金",   full:"お金が残る",           caps:["money"]},
  {key:"future",   n:6, name:"時間",   full:"将来の時間を減らせる",   caps:["time"]},
];
const RES = Object.fromEntries(RESIDUES.map(r => [r.key, r]));
const resColor = k => CAPITALS[RES[k].caps[0]].color;

const DIFF = {
  easy:{name:"かんたん", exp:10, gold:5},
  mid :{name:"ふつう",   exp:25, gold:12},
  hard:{name:"たいへん", exp:50, gold:25},
};
const TITLES = [[1,"かけだし"],[3,"見習い"],[6,"旅人"],[10,"熟練者"],[15,"達人"],[20,"賢者"],[30,"伝説"]];

const RES_HINTS = [
  [/読|学|勉強|講座|語学|資格|練習|訓練|研究|調査|リサーチ|観測|分析/, "ability"],
  [/完成|納品|公開|提出|達成|出展|登壇|発売|入稿|実行/, "record"],
  [/記事|投稿|動画|写真|作品|ZINE|コンテンツ|撮影|制作|執筆|編集|デザイン|ページ/, "work"],
  [/連絡|返信|会う|紹介|DM|打合|面談|依頼|共有|イベント|交流|取材|営業/, "relation"],
  [/販売|売上|請求|価格|在庫|決済|入金|投資|仕入|発送|注文/, "money"],
  [/自動化|外注|効率|テンプレ|仕組み|整理|片づけ|設定|導入|準備/, "future"],
];
const guessResidues = t => RES_HINTS.filter(([re]) => re.test(t)).map(([,k]) => k);

const todayKey = () => new Date().toLocaleDateString("sv-SE");
const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate()-1); return d.toLocaleDateString("sv-SE"); };
const uid = () => Math.random().toString(36).slice(2,9);
const needExp = lv => 50 + lv*30;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function seed(){
  return {
    level:1, exp:0, gold:0,
    capitals:{human:0, social:0, money:0, asset:0, time:0},
    counts:{ability:0, record:0, work:0, relation:0, money:0, future:0},
    spent:0,
    birthYear:null, timeline:{}, schedule:{}, workRules:{},
    skills:[
      {id:uid(), name:"英語",     cat:"lang"},
      {id:uid(), name:"スペイン語", cat:"lang"},
      {id:uid(), name:"写真撮影",  cat:"shoot"},
      {id:uid(), name:"動画撮影",  cat:"shoot"},
      {id:uid(), name:"画像編集",  cat:"edit"},
      {id:uid(), name:"動画編集",  cat:"edit"},
    ],
    dailies:[
      {id:uid(), name:"30分うごく（散歩・筋トレ）", diff:"mid",  res:["ability"], last:"", streak:0},
      {id:uid(), name:"本を10ページ読む",          diff:"easy", res:["ability"], last:"", streak:0},
      {id:uid(), name:"やったことを1行記録する",     diff:"easy", res:["record"], last:"", streak:0},
    ],
    quests:[
      {id:uid(), name:"学んだことを記事にして公開する", diff:"hard", res:["ability","record","work"], done:false},
      {id:uid(), name:"しばらく会えていない人に連絡する", diff:"easy", res:["relation"], done:false},
    ],
    bosses:[
      {id:uid(), name:"作品を1つ完成させて売る", res:["work","record","money"], max:20, hp:20, slain:false},
    ],
    rewards:[
      {id:uid(), name:"好きなだけ寝る", cost:60},
      {id:uid(), name:"欲しかった物を買う", cost:200},
    ],
    log:[],
  };
}

/* 旧バージョン（能力値5種）からの引き継ぎ */
function migrate(old){
  const s = seed();
  Object.assign(s, {
    level: old.level ?? 1, exp: old.exp ?? 0, gold: old.gold ?? 0,
    rewards: old.rewards ?? s.rewards, log: old.log ?? [],
  });
  const conv = list => (list || []).map(x => ({...x, res: x.res || guessResidues(x.name)}));
  s.dailies = conv(old.dailies).length ? conv(old.dailies) : s.dailies;
  s.quests  = conv(old.quests);
  s.bosses  = conv(old.bosses);
  return s;
}

let S;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) S = {...seed(), ...JSON.parse(raw)};
  else {
    const old = localStorage.getItem(OLD_KEY);
    S = old ? migrate(JSON.parse(old)) : seed();
  }
} catch(e){ S = seed(); }
S.capitals = {...seed().capitals, ...(S.capitals||{})};
S.counts   = {...seed().counts,   ...(S.counts||{})};
S.timeline = {...(S.timeline||{})};
S.schedule = {...(S.schedule||{})};
S.workRules = {...(S.workRules||{})};
if (!Array.isArray(S.skills)) S.skills = seed().skills;
// 旧データ（スキルのみ）を資本ごとの持ちものへ移す
if (!Array.isArray(S.holdings)){
  S.holdings = S.skills.map(x => ({id:x.id, name:x.name, cap:"human", cat:x.cat || "other"}));
}

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

let tab = "quest";
const drafts = {daily:new Set(), quest:new Set(), boss:new Set()};

/* ── 進行 ──────────────────────────────────────── */
function addLog(text){
  S.log.unshift({t:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}), text});
  S.log = S.log.slice(0,60);
}
function toast(html, kind){
  const d = document.createElement("div");
  d.className = "toast" + (kind ? " " + kind : "");
  d.innerHTML = html;
  el("toasts").appendChild(d);
  setTimeout(() => d.remove(), 4200);
}
function titleOf(lv){ let t = TITLES[0][1]; for (const [n,name] of TITLES) if (lv >= n) t = name; return t; }

/** 難易度と「残るもの」から報酬を決める。何も残らなければ消費扱いで半減 */
function payout(diff, res){
  const base = DIFF[diff] || DIFF.mid;
  const n = (res || []).length;
  if (!n) return {exp: Math.round(base.exp/2), gold: Math.round(base.gold/2), consumed:true};
  return {exp: base.exp + n*8, gold: base.gold + (res.includes("money") ? 10 : 0), consumed:false};
}
function gain(exp, gold, res){
  S.exp += exp; S.gold += gold;
  (res || []).forEach(k => {
    S.counts[k] = (S.counts[k]||0) + 1;
    RES[k].caps.forEach(c => { S.capitals[c] = (S.capitals[c]||0) + 1; });
  });
  while (S.exp >= needExp(S.level)){
    S.exp -= needExp(S.level);
    S.level++;
    addLog(`レベル ${S.level}「${titleOf(S.level)}」になった`);
    toast(`<b>レベルアップ！</b> Lv.${S.level}「${titleOf(S.level)}」`, "level");
  }
}
const capsLine = res => (res || []).map(k => `${CAPITALS[RES[k].caps[0]].name}+`).join(" ") || "資本は増えない（消費）";

function reward(item, diff){
  const p = payout(diff, item.res);
  gain(p.exp, p.gold, item.res);
  if (p.consumed) S.spent++;
  return p;
}

function completeDaily(id){
  const d = S.dailies.find(x => x.id === id);
  if (!d || d.last === todayKey()) return;
  d.streak = d.last === yesterdayKey() ? d.streak + 1 : 1;
  d.last = todayKey();
  const bonus = Math.min(d.streak - 1, 10) * 2;
  const p = payout(d.diff, d.res);
  gain(p.exp + bonus, p.gold, d.res);
  if (p.consumed) S.spent++;
  addLog(`日課「${d.name}」達成（${d.streak}日連続）+${p.exp+bonus}EXP・${capsLine(d.res)}`);
  toast(`+${p.exp + bonus} EXP / +${p.gold} G<br>${capsLine(d.res)}${d.streak >= 2 ? "　🔥"+d.streak+"日連続" : ""}`);
  save(); render();
}
function completeQuest(id){
  const q = S.quests.find(x => x.id === id);
  if (!q || q.done) return;
  q.done = true;
  const p = reward(q, q.diff);
  addLog(`クエスト「${q.name}」達成 +${p.exp}EXP・${capsLine(q.res)}`);
  toast(`+${p.exp} EXP / +${p.gold} G<br>${capsLine(q.res)}`);
  save(); render();
}
function hitBoss(id){
  const b = S.bosses.find(x => x.id === id);
  if (!b || b.slain) return;
  b.hp = Math.max(0, b.hp - 1);
  gain(6, 3, []);
  if (b.hp === 0){
    b.slain = true;
    const exp = b.max*5, gold = b.max*3;
    gain(exp, gold, b.res);
    (b.res || []).forEach(k => RES[k].caps.forEach(c => { S.capitals[c] += 2; }));
    addLog(`ボス「${b.name}」討伐！ +${exp}EXP・${capsLine(b.res)}`);
    toast(`<b>${esc(b.name)} 討伐！</b><br>+${exp} EXP / +${gold} G　${capsLine(b.res)}`, "level");
  } else {
    addLog(`「${b.name}」を1回ぶん進めた（残り${b.hp}）`);
    toast(`残り ${b.hp} / ${b.max}　+6 EXP`);
  }
  save(); render();
}
function buy(id){
  const r = S.rewards.find(x => x.id === id);
  if (!r) return;
  if (S.gold < r.cost){ toast("ゴールドが足りません。"); return; }
  S.gold -= r.cost;
  addLog(`ごほうび「${r.name}」と交換（-${r.cost}G）`);
  toast(`「${esc(r.name)}」と交換した。楽しんで！`);
  save(); render();
}

/* ── 描画 ──────────────────────────────────────── */
const el = id => document.getElementById(id);
const resChips = res => (res && res.length
  ? res.map(k => `<span class="res" style="background:${resColor(k)}">${RES[k].name}</span>`).join("")
  : `<span class="res" style="background:#e9ecef;color:var(--text-sub)">消費</span>`);

function flagRow(kind){
  return `<div class="form-label">この行動で残るもの（選ぶほどEXPと資本が増える）</div>
    <div class="flags">${RESIDUES.map(r => {
      const on = drafts[kind].has(r.key);
      return `<button class="flag" data-flag="${kind}:${r.key}" aria-pressed="${on}"
        style="${on ? `background:${CAPITALS[r.caps[0]].color}` : ""}"
        title="${r.full} → ${r.caps.map(c => CAPITALS[c].name).join("・")}">${on ? "✓ " : ""}${r.n}. ${r.name}</button>`;
    }).join("")}</div>`;
}

function renderStatus(){
  el("level").textContent = S.level;
  el("title-name").textContent = "「" + titleOf(S.level) + "」";
  const need = needExp(S.level);
  el("exp-bar").style.width = Math.min(100, S.exp/need*100) + "%";
  el("exp-note").textContent = `${S.exp} / ${need}`;
  el("gold").textContent = S.gold.toLocaleString("ja-JP");
  el("today-done").textContent = S.dailies.filter(d => d.last === todayKey()).length + " / " + S.dailies.length;
  el("spent").textContent = S.spent || 0;

  const vals = Object.values(S.capitals);
  el("cap-total").textContent = "資本の合計 " + vals.reduce((a,b) => a+b, 0);
  el("caps").innerHTML = Object.entries(CAPITALS).map(([k,c]) => `
    <button class="cap" data-cap="${k}" aria-label="${c.name}のページを開く">
      <div class="cap-name"><span class="dot" style="background:${c.color}"></span>${c.name}<em>（${c.sub}）</em></div>
      <div class="cap-val">${S.capitals[k]||0}</div>
      <small>${c.note}</small>
      <span class="cap-more">ひらく →</span>
    </button>`).join("");
}

const DIFF_SELECT = id => `<select id="${id}" aria-label="難易度">${
  Object.entries(DIFF).map(([k,v]) => `<option value="${k}"${k==="mid"?" selected":""}>${v.name}（${v.exp}EXP）</option>`).join("")}</select>`;

function itemRow(x, kind, done){
  const p = payout(x.diff, x.res);
  return `<div class="item ${done?"done":""}" style="border-left-color:${x.res && x.res.length ? resColor(x.res[0]) : "var(--border-main)"}">
    <button class="check" data-${kind}="${x.id}" aria-label="${esc(x.name)}を達成">${done?"✓":""}</button>
    <div class="name"><span class="t">${esc(x.name)}</span>
      <div class="meta">${resChips(x.res)}
        <span class="tag">${p.exp}EXP / ${p.gold}G</span>
        ${x.streak ? `<span class="streak">🔥 ${x.streak}日連続</span>` : ""}</div>
    </div>
    <button class="del" data-del="${kind === "daily" ? "dailies" : "quests"}:${x.id}" aria-label="削除">✕</button>
  </div>`;
}

function renderDaily(){
  const t = todayKey();
  const now = new Date();
  const date = now.toLocaleDateString("ja-JP",{month:"long",day:"numeric"})
    + "（" + now.toLocaleDateString("ja-JP",{weekday:"short"}) + "）";

  el("daily-card").innerHTML = `<h2>${date} <span>8:00〜24:00・30分ごと</span></h2>`
    + scheduleHtml()
    + `<h2 style="margin-top:26px">日課 <span>毎日リセット・連続でボーナス</span></h2>
      <div class="items">${S.dailies.length
        ? S.dailies.map(d => itemRow(d, "daily", d.last === t)).join("")
        : `<p class="empty">毎日くり返したいことを登録しよう。</p>`}</div>
      <div class="form">
        <input type="text" id="d-name" placeholder="日課（例：30分ぶんの作品制作）" maxlength="40">
        ${DIFF_SELECT("d-diff")}
        <button class="btn" data-add="daily">追加</button>
        ${flagRow("daily")}
      </div>`;
}

function renderPanel(){
  const p = el("panel");

  if (tab === "quest"){
    const open = S.quests.filter(q => !q.done), done = S.quests.filter(q => q.done);
    p.innerHTML = `<h2>クエスト <span style="color:var(--text-sub)">一度きりのやること</span></h2>
      <div class="items">${open.length
        ? open.map(q => itemRow(q, "quest", false)).join("")
        : `<p class="empty">やることを登録すると経験値と資本になります。</p>`}</div>
      ${done.length ? `<h2 style="margin-top:16px">達成済み（${done.length}）</h2>
        <div class="items">${done.map(q => itemRow(q, "quest", true)).join("")}</div>` : ""}
      <div class="form">
        <input type="text" id="q-name" placeholder="やること（例：取材記事を1本書いて公開する）" maxlength="40">
        ${DIFF_SELECT("q-diff")}
        <button class="btn" data-add="quest">追加</button>
        ${flagRow("quest")}
      </div>`;
    return;
  }

  if (tab === "boss"){
    p.innerHTML = `<h2>ボス <span style="color:var(--text-sub)">回数で削る大きな目標</span></h2>
      <div>${S.bosses.length ? S.bosses.map(b => `
        <div class="boss ${b.slain?"slain":""}">
          <div class="boss-head"><span class="boss-name">${esc(b.name)}</span>
            <span class="boss-num">${b.max - b.hp} / ${b.max} 回</span></div>
          <div class="boss-hp"><i style="width:${b.hp/b.max*100}%"></i></div>
          <div class="boss-foot">
            <span class="meta" style="display:flex;gap:6px;flex-wrap:wrap">${resChips(b.res)}
              <span class="boss-num">討伐報酬 ${b.max*5}EXP / ${b.max*3}G</span></span>
            <span>${b.slain ? "" : `<button class="btn small" data-boss="${b.id}">1回ぶん進めた</button>`}
              <button class="btn small danger" data-del="bosses:${b.id}">削除</button></span>
          </div>
        </div>`).join("") : `<p class="empty">「何回やれば終わるか」で大きな目標を登録しよう。</p>`}</div>
      <div class="form">
        <input type="text" id="b-name" placeholder="目標（例：ZINEを1冊作って売り切る）" maxlength="40">
        <input type="number" id="b-max" value="20" min="1" max="999" aria-label="必要な回数">
        <button class="btn" data-add="boss">追加</button>
        ${flagRow("boss")}
      </div>`;
    return;
  }

  if (tab === "notion") return renderNotion(p);
  if (tab.startsWith("cap:")) return renderCapital(p, tab.slice(4));
  if (tab === "history") return renderHistory(p);
  if (tab === "map") return renderMap(p);
}

/* ── 攻略法タブ ─────────────────────────────────── */
const box = (x,y,w,h,label,note,val,color) => `
  <rect x="${x+5}" y="${y+5}" width="${w}" height="${h}" rx="14" fill="currentColor"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${color||"#ffffff"}" stroke="currentColor" stroke-width="3"/>
  <text x="${x+w/2}" y="${y+27}" text-anchor="middle" font-size="19" font-weight="900" fill="currentColor">${label}</text>
  <text x="${x+w/2}" y="${y+48}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" opacity=".75">${note}</text>
  ${val !== null ? `<text x="${x+w/2}" y="${y+h-11}" text-anchor="middle" font-size="16" font-weight="900" fill="currentColor">${val}</text>` : ""}`;

const arrow = (x1,y1,x2,y2,label,lx,ly,color) => `
  <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color||"currentColor"}" stroke-width="${color?4:2}"
    marker-end="url(#ah)"/>
  ${label ? `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">${label}</text>` : ""}`;

function renderMap(p){
  const c = S.capitals;
  p.innerHTML = `<h2>攻略法 <span style="color:var(--text-sub)">時間を資本に変えて、時間を買い戻す</span></h2>
  <figure>

/* ── 1日のスケジュール（8:00〜24:00・30分きざみ） ───── */
const SLOT_FROM = 8, SLOT_COUNT = 32;           // 8:00 から 32コマ＝16時間
const slotLabel = i => {
  const h = SLOT_FROM + Math.floor(i / 2), m = i % 2 ? "30" : "00";
  return `${h}:${m}`;
};
/** 時間割の項目：5つの資本に「必要維持」を足したもの */
const SCHED_ITEMS = {
  ...Object.fromEntries(Object.entries(CAPITALS).map(([k,c]) => [k, {label:`${c.name}（${c.sub}）`, sub:c.sub, color:c.color}])),
  base: {label:"必要維持（食事・シャワー・睡眠）", sub:"必要維持", color:"#ced4da"},
};
let palPick = "human";

const todaySched = () => (S.schedule[todayKey()] = S.schedule[todayKey()] || {});

function slotStyle(cap){
  return cap && SCHED_ITEMS[cap] ? `background:${SCHED_ITEMS[cap].color}` : "background:#fff";
}
const slotText = cap => (cap && SCHED_ITEMS[cap]) ? SCHED_ITEMS[cap].sub : "";

function scheduleHtml(){
  const day = todaySched();
  const rows = Array.from({length: SLOT_COUNT}, (_, i) => {
    const cap = day[i];
    return `<button class="slot ${i % 2 === 0 ? "hour" : ""}" data-slot="${i}" aria-label="${slotLabel(i)}">
      <span class="slot-time">${i % 2 === 0 ? slotLabel(i) : ""}</span>
      <span class="slot-fill" style="${slotStyle(cap)}">${slotText(cap)}</span>
    </button>`;
  }).join("");

  const pal = Object.entries(SCHED_ITEMS).map(([k,it]) => `
    <button data-pal="${k}" aria-pressed="${palPick === k}"
      style="${palPick === k ? `background:${it.color}` : ""}">${it.label}</button>`).join("")
    + `<button data-pal="" aria-pressed="${palPick === ""}"
        style="${palPick === "" ? "background:#e9ecef" : ""}">消す</button>`;

  return `<div class="sched">
      <div class="sched-grid" id="sched">${rows}</div>
      <div class="sched-pal">
        <h3>何に使う？</h3>
        <p>右で選んで、左のマスを押す（なぞってもOK）。</p>
        <div class="pal">${pal}</div>
        <div class="sched-sum" id="sched-sum">${schedSumHtml()}</div>
      </div>
    </div>`;
}

function schedSumHtml(){
  const day = todaySched();
  const counts = {};
  Object.values(day).forEach(k => { if (k) counts[k] = (counts[k] || 0) + 1; });
  const used = Object.values(counts).reduce((a,b) => a + b, 0);
  return Object.entries(SCHED_ITEMS).map(([k,it]) =>
    `<div><span>${it.sub}</span><b>${((counts[k]||0)/2).toFixed(1)}h</b></div>`).join("")
    + `<div style="border-top:1px dotted #ced4da;margin-top:4px;padding-top:4px">
        <span>空き</span><b>${((SLOT_COUNT - used)/2).toFixed(1)}h</b></div>`;
}

/** マスを塗る（画面全体を描き直さずに、その場だけ更新する） */
function paintSlot(btn){
  const i = btn.dataset.slot;
  const day = todaySched();
  if (palPick) day[i] = palPick; else delete day[i];
  const fill = btn.querySelector(".slot-fill");
  fill.setAttribute("style", slotStyle(day[i]));
  fill.textContent = slotText(day[i]);
  const sum = el("sched-sum");
  if (sum) sum.innerHTML = schedSumHtml();
  save();
}

let painting = false;
document.addEventListener("pointerdown", ev => {
  const btn = ev.target.closest(".slot");
  if (!btn) return;
  painting = true;
  paintSlot(btn);
  ev.preventDefault();
});
document.addEventListener("pointerover", ev => {
  if (!painting) return;
  const btn = ev.target.closest(".slot");
  if (btn) paintSlot(btn);
});
document.addEventListener("pointerup", () => { painting = false; });
document.addEventListener("pointercancel", () => { painting = false; });

  let lv = 0;
  CAP_STEPS.forEach(need => { if (n >= need) lv++; });
  const next = CAP_STEPS[lv];
  return {lv, next, remain: next ? next - n : 0};
}

/** 西暦から和暦へ。境界の年は「その年の大半を占める元号」で表す */
function wareki(y){
  const eras = [[2019,"令和",2018],[1989,"平成",1988],[1927,"昭和",1925],[1913,"大正",1911],[1868,"明治",1867]];
  for (const [from, name, base] of eras){
    if (y >= from){ const n = y - base; return name + (n === 1 ? "元年" : n + "年"); }
  }
  return "";
}

const AGE_HINTS = {
  0:"生まれた場所は？", 3:"いちばん古い記憶は？", 6:"小学校に入学", 10:"熱中していたこと",
  12:"小学校を卒業", 13:"中学校に入学", 15:"高校受験・進路", 16:"はまっていたこと",
  18:"高校卒業・進路を決めた年", 20:"成人。何を始めた？", 22:"社会に出た年",
  25:"転機になったこと", 28:"手に入れたもの", 30:"30才で見えたこと",
};

function renderHistory(p){
  const by = S.birthYear;
  const head = `<h2>履歴 <span>0才から30才までのひと言年表</span></h2>`;

  if (!by){
    p.innerHTML = head + `
      <div class="notice">生まれた年（西暦）を入れると、0才から30才までが和暦つきで並びます。</div>
      <div class="form" style="border-top:none;padding-top:16px">
        <input type="number" id="birth-year" placeholder="例：1990" min="1900" max="2100"
          style="width:130px" aria-label="生まれた年（西暦）">
        <button class="btn yellow" data-birth="set">年表をつくる</button>
      </div>`;
    return;
  }

  const words = [];
  for (let age = 0; age <= 30; age++) words.push({age, y:by + age, word:(S.timeline[age] || "").trim()});
  const filled = words.filter(w => w.word);
  const editing = S.tlEdit === true || !filled.length;

  const bar = `
    <div class="tl-setup">
      <span class="pill">${by}年生まれ</span>
      <span class="pill done"><b id="tl-count">${filled.length}</b> / 31 記入</span>
      <button class="btn small ${editing ? "yellow" : ""}" data-tl="${editing ? "read" : "edit"}">${editing ? "書き終えた" : "書き足す"}</button>
      <button class="btn small" data-birth="edit">生まれた年を変える</button>
    </div>`;

  if (!editing){
    p.innerHTML = head + bar + `<div class="tl tl-read">${
      filled.map(w => `
        <div class="tl-row filled">
          <div class="tl-when"><span class="tl-wa">${wareki(w.y)}</span><span class="tl-ad">${w.y}</span><span class="tl-age">${w.age}才</span></div>
          <div class="tl-word">${esc(w.word)}</div>
        </div>`).join("")}</div>`;
    return;
  }

  p.innerHTML = head + bar + `<div class="tl">${
    words.map(w => `
      <div class="tl-row ${w.word ? "filled" : ""}">
        <div class="tl-when"><span class="tl-wa">${wareki(w.y)}</span><span class="tl-ad">${w.y}</span><span class="tl-age">${w.age}才</span></div>
        <div class="tl-word">
          <input type="text" data-year="${w.age}" maxlength="60" value="${esc(w.word)}"
            placeholder="${AGE_HINTS[w.age] || "ひと言"}" aria-label="${w.y}年（${w.age}才）のひと言">
        </div>
      </div>`).join("")}</div>`;
}

/* ── Notion 連携 ─────────────────────────────────── */
const NOTION_SERVER = "Notion";
const SECTION_DIFF = {"最優先":"hard","期限超過":"hard","今日中":"mid","余裕があれば":"easy","今週の次のステップ":"mid"};
let notion = {status:"idle", pages:[], pageId:null, pageTitle:"", pageUrl:"", items:[], error:"", busy:false};

const ERROR_COPY = {
  needs_reauth:"Notionの接続が切れています。claude.ai の 設定 → コネクター で Notion を再接続してください。",
  server_not_connected:"Notionコネクターが見つかりません。claude.ai の 設定 → コネクター で Notion を追加してください。",
  selection_required:"同じ名前のNotion接続が複数あります。表示される選択画面でどれを使うか選んでください。",
  server_not_found:"Notion接続が見つかりませんでした。設定 → コネクター を確認してください。",
  server_unavailable:"Notionに一時的につながりませんでした。少し待ってもう一度お試しください。",
  not_in_manifest:"このページはその操作をNotionに要求できません。",
  blocked_by_policy:"組織の設定でこの操作が許可されていません。",
  approval_required:"この操作には管理者の承認が必要です。",
  tool_error:"Notion側でエラーが返りました。",
  bad_request:"リクエストの内容が不正でした。",
  rate_limited:"呼び出しが多すぎます。少し待ってからお試しください。",
};
const errText = e => (ERROR_COPY[e && e.code] || "Notionの読み込みに失敗しました。")
  + (e && e.message && !ERROR_COPY[e.code] ? "（" + e.message + "）" : "");

async function mcpns(){
  try { return window.claude && claude.use ? await claude.use("mcp") : null; } catch(e){ return null; }
}

function parseTodos(text){
  const items = []; let section = "やること", n = 0;
  for (const raw of String(text).split("\n")){
    const h = raw.match(/^##+\s*(.+?)\s*$/);
    if (h){ section = h[1]; continue; }
    const m = raw.match(/^\s*-\s\[( |x|X)\]\s*(.+?)\s*$/);
    if (!m) continue;
    const label = m[2].replace(/\*\*/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1");
    items.push({id:"n"+(n++), line:raw.trim(), text:label, done:m[1].toLowerCase()==="x",
      section, res:guessResidues(label), diff:SECTION_DIFF[section] || "mid"});
  }
  return items;
}

async function notionLoad(pageId){
  const mcp = await mcpns();
  if (!mcp){ notion.status = "unavailable"; renderPanel(); return; }
  notion.status = "loading"; notion.error = ""; renderPanel();
  try {
    if (!pageId){
      const r = await mcp.callTool(NOTION_SERVER, "notion-search",
        {query:"やること", page_size:10, max_highlight_length:0}, {cache:{staleTime:60000}});
      const found = ((r.payload && r.payload.results) || [])
        .filter(x => x.type === "page" && /やること|TODO|ToDo|タスク/i.test(x.title));
      if (!found.length) throw {code:"empty"};
      notion.pages = found.slice(0,6).map(x => ({id:x.id, title:x.title}));
      pageId = notion.pages[0].id;
    }
    const f = await mcp.callTool(NOTION_SERVER, "notion-fetch", {id:pageId}, {cache:{staleTime:30000}});
    const pg = f.payload || {};
    notion.pageId = pageId;
    notion.pageTitle = pg.title || "Notionのページ";
    notion.pageUrl = pg.url || "";
    notion.items = parseTodos(pg.text || "");
    notion.status = "ready";
  } catch(e){
    notion.status = "error";
    notion.error = e && e.code === "empty"
      ? "「やること」を含むページが見つかりませんでした。Notionでページ名に『やること』を含めるか、チェックボックスのあるページを用意してください。"
      : errText(e);
  }
  renderPanel();
}

async function notionComplete(itemId){
  const it = notion.items.find(x => x.id === itemId);
  if (!it || notion.busy) return;
  const mcp = await mcpns();
  if (!mcp){ notion.status = "unavailable"; renderPanel(); return; }

  notion.busy = true; renderPanel();
  try {
    await mcp.callTool(NOTION_SERVER, "notion-update-page", {
      page_id: notion.pageId,
      command: "update_content",
      content_updates: [{old_str: it.line, new_str: it.line.replace(/^-\s\[\s\]/, "- [x]")}],
    });
    const p = payout(it.diff, it.res);
    gain(p.exp, p.gold, it.res);
    if (p.consumed) S.spent++;
    it.done = true;
    addLog(`Notion「${it.text}」完了 +${p.exp}EXP・${capsLine(it.res)}`);
    toast(`+${p.exp} EXP / +${p.gold} G<br>${capsLine(it.res)}<br>Notionにもチェックを入れました`);
    save();
    try { await mcp.invalidate(NOTION_SERVER, "notion-fetch"); } catch(e){}
  } catch(e){
    const amb = e && (e.code === "server_unavailable" || e.code === "upstream_error" || e.code === "cancelled");
    toast(errText(e) + (amb ? "<br>Notion側は更新済みかもしれません。「最新に更新」で確認してください。" : ""));
  }
  notion.busy = false;
  renderStatus(); renderDaily(); renderPanel(); renderSide();
}

/** Notion項目の「残るもの」を手で直す */
function toggleNotionRes(itemId, key){
  const it = notion.items.find(x => x.id === itemId);
  if (!it) return;
  it.res = it.res.includes(key) ? it.res.filter(k => k !== key) : [...it.res, key];
  renderPanel();
}

function renderNotion(p){
  const N = notion;
  const head = `<h2>Notion <span style="color:var(--text-sub)">やることページをクエストに</span></h2>`;

  if (N.status === "unavailable"){
    p.innerHTML = head + `<div class="notice"><b>この画面ではNotionに接続できません。</b><br>
      Notion連携は claude.ai で公開したURL版で動きます。ローカルのファイルからは連携できないため、
      日課・クエスト・ボスのタブをお使いください。</div>`;
    return;
  }
  if (N.status === "idle"){
    p.innerHTML = head + `<div class="notice">Notionの「やること」ページを読み込んで、チェックボックスをクエストに変えます。
      アプリで達成すると、Notion側のチェックも入ります。</div>
      <div class="form" style="border-top:none;padding-top:12px"><button class="btn" data-notion="load">Notionを読み込む</button></div>`;
    return;
  }
  if (N.status === "loading"){ p.innerHTML = head + `<div class="notice">Notionを読み込んでいます…</div>`; return; }
  if (N.status === "error"){
    p.innerHTML = head + `<div class="notice bad">${esc(N.error)}</div>
      <div class="form" style="border-top:none;padding-top:12px"><button class="btn" data-notion="load">もう一度ためす</button></div>`;
    return;
  }

  const picker = N.pages.length > 1 ? `<div class="pagepick">${
    N.pages.map(pg => `<button data-npage="${pg.id}" aria-pressed="${pg.id === N.pageId}">${esc(pg.title)}</button>`).join("")}</div>` : "";

  const open = N.items.filter(i => !i.done);
  const sections = [...new Set(open.map(i => i.section))];
  const body = sections.length ? sections.map(sec => `
      <div class="sect">${esc(sec)}</div>
      <div class="items">${open.filter(i => i.section === sec).map(i => {
        const pay = payout(i.diff, i.res);
        return `<div class="item" style="border-left-color:${i.res.length ? resColor(i.res[0]) : "var(--border-main)"}">
          <button class="check" data-ntodo="${i.id}" aria-label="${esc(i.text)}を達成">✓</button>
          <div class="name"><span class="t">${esc(i.text)}</span>
            <div class="meta">${RESIDUES.map(r => {
              const on = i.res.includes(r.key);
              return `<button class="res" data-nres="${i.id}:${r.key}" aria-pressed="${on}"
                style="cursor:pointer;font-family:inherit;background:${on ? CAPITALS[r.caps[0]].color : "#fff"};
                color:${on ? "var(--text-main)" : "#adb5bd"}" title="${r.full}">${r.name}</button>`;
            }).join("")}<span class="tag">${pay.exp}EXP / ${pay.gold}G</span></div>
          </div>
        </div>`;
      }).join("")}</div>`).join("")
    : `<p class="empty">未完了のチェックボックスはありません。おつかれさまでした。</p>`;

  p.innerHTML = head + picker + `
    <div class="src">
      <span class="name">📄 <a href="${esc(N.pageUrl)}" target="_blank" rel="noopener">${esc(N.pageTitle)}</a>
        <span style="color:var(--text-sub)">　未完了 ${open.length} / ${N.items.length}</span></span>
      <button class="btn small" data-notion="reload">最新に更新</button>
    </div>
    <p style="font-size:.78rem;color:var(--text-sub);margin:0 0 8px">タグを押すと「何が残るか」を直せます。多いほどEXPと資本が増えます。</p>
    <div class="${N.busy ? "busy" : ""}">${body}</div>`;
}

function renderSide(){
  el("rewards").innerHTML = S.rewards.length ? S.rewards.map(r => `
    <div class="reward">
      <span class="name">${esc(r.name)}</span>
      <span class="cost">${r.cost} G</span>
      <button class="btn small yellow" data-buy="${r.id}" ${S.gold < r.cost ? "disabled" : ""}>交換</button>
      <button class="del" data-del="rewards:${r.id}" aria-label="削除">✕</button>
    </div>`).join("") : `<p class="empty">自分へのごほうびを決めよう。</p>`;

  el("log").innerHTML = S.log.length
    ? S.log.map(l => `<li><time>${l.t}</time><span>${esc(l.text)}</span></li>`).join("")
    : `<li style="color:var(--text-sub)">まだ記録はありません。</li>`;
}

const render = () => { renderStatus(); renderDaily(); renderPanel(); renderSide(); };

/* ── 操作 ──────────────────────────────────────── */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;

  if (t.dataset.tab){
    tab = t.dataset.tab;
    if (t.classList.contains("btn")) document.querySelector('.tab[data-tab="quest"]')?.setAttribute("aria-selected","true");
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b === t)));
    return renderPanel();
  }
  if (t.dataset.flag){
    const [kind, key] = t.dataset.flag.split(":");
    drafts[kind].has(key) ? drafts[kind].delete(key) : drafts[kind].add(key);
    return renderPanel();
  }
  if (t.dataset.nres){
    const [id, key] = t.dataset.nres.split(":");
    return toggleNotionRes(id, key);
  }
  if (t.dataset.hold){
    const [cap, cat, ...rest] = t.dataset.hold.split(":");
    const name = rest.join(":");
    if (!S.holdings.some(x => x.cap === cap && x.name === name)){
      S.holdings.push({id:uid(), name, cap, cat});
      save(); toast(`「${esc(name)}」を ${CAPITALS[cap].name} に登録しました`);
    }
    return renderPanel();
  }
  if (t.dataset.rule){
    const n = t.dataset.rule;
    S.workRules[n] = !S.workRules[n];
    save();
    t.classList.toggle("on", !!S.workRules[n]);
    const c = el("rule-count");
    if (c) c.textContent = Object.values(S.workRules).filter(Boolean).length;
    return;
  }
  if (t.dataset.pal !== undefined){ palPick = t.dataset.pal; return renderDaily(); }
  if (t.dataset.cap){ tab = "cap:" + t.dataset.cap; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected","false")); return renderPanel(); }
  if (t.dataset.birth === "set"){
    const y = parseInt(el("birth-year")?.value, 10);
    if (!y || y < 1900 || y > 2100){ toast("生まれた年を西暦4桁で入れてください（例：1990）"); return; }
    S.birthYear = y; save(); return renderPanel();
  }
  if (t.dataset.birth === "edit"){ S.birthYear = null; save(); return renderPanel(); }
  if (t.dataset.tl){ S.tlEdit = t.dataset.tl === "edit"; save(); return renderPanel(); }
  if (t.dataset.notion) return notionLoad(t.dataset.notion === "reload" ? notion.pageId : null);
  if (t.dataset.npage) return notionLoad(t.dataset.npage);
  if (t.dataset.ntodo) return notionComplete(t.dataset.ntodo);
  if (t.dataset.daily) return completeDaily(t.dataset.daily);
  if (t.dataset.quest) return completeQuest(t.dataset.quest);
  if (t.dataset.boss)  return hitBoss(t.dataset.boss);
  if (t.dataset.buy)   return buy(t.dataset.buy);

  if (t.dataset.del){
    const [list, id] = t.dataset.del.split(":");
    S[list] = S[list].filter(x => x.id !== id);
    save(); return render();
  }

  if (t.dataset.add){
    const kind = t.dataset.add;
    const val = id => (el(id)?.value || "").trim();
    if (kind === "daily"){
      const name = val("d-name"); if (!name) return;
      S.dailies.push({id:uid(), name, diff:el("d-diff").value, res:[...drafts.daily], last:"", streak:0});
      drafts.daily.clear();
    }
    if (kind === "quest"){
      const name = val("q-name"); if (!name) return;
      S.quests.push({id:uid(), name, diff:el("q-diff").value, res:[...drafts.quest], done:false});
      drafts.quest.clear();
    }
    if (kind === "boss"){
      const name = val("b-name"); if (!name) return;
      const max = Math.max(1, Math.min(999, parseInt(el("b-max").value, 10) || 20));
      S.bosses.push({id:uid(), name, res:[...drafts.boss], max, hp:max, slain:false});
      drafts.boss.clear();
    }
    if (kind.startsWith("hold:")){
      const cap = kind.slice(5);
      const name = val("hold-name"); if (!name) return;
      if (!S.holdings.some(x => x.cap === cap && x.name === name)){
        S.holdings.push({id:uid(), name, cap, cat:el("hold-cat") ? el("hold-cat").value : "other"});
      }
      el("hold-name").value = "";
    }
    if (kind === "reward"){
      const name = val("r-name"); if (!name) return;
      S.rewards.push({id:uid(), name, cost:Math.max(1, Math.min(9999, parseInt(el("r-cost").value, 10) || 50))});
      el("r-name").value = "";
    }
    save(); return render();
  }

  if (t.id === "reset" && confirm("記録をすべて消して最初からはじめますか？")){
    S = seed(); save(); render();
  }
});

document.addEventListener("input", ev => {
  const age = ev.target.dataset && ev.target.dataset.year;
  if (age === undefined) return;
  S.timeline[age] = ev.target.value;
  ev.target.closest(".tl-row")?.classList.toggle("filled", !!ev.target.value.trim());
  const count = el("tl-count");
  if (count) count.textContent = Object.values(S.timeline).filter(v => v && v.trim()).length;
  save();
});

document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" || ev.target.tagName !== "INPUT" || ev.target.dataset.year !== undefined) return;
  const map = {"d-name":"daily","q-name":"quest","b-name":"boss","b-max":"boss","r-name":"reward","r-cost":"reward"};
  const kind = map[ev.target.id];
  if (kind) document.querySelector(`[data-add="${kind}"]`)?.click();
});

render();
</script>
